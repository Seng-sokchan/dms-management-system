services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/dms-backend/Dockerfile
    container_name: dms-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
